name: Validate branch name

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$SOURCE_BRANCH" != feature/* &&
                "$SOURCE_BRANCH" != fix/* &&
                "$SOURCE_BRANCH" != hotfix/* ]]; then
            echo "Invalid source branch name: $SOURCE_BRANCH"
            echo "Use feature/*, fix/* or hotfix/*"
            exit 1
          fi

          echo "Valid source branch name: $SOURCE_BRANCH"
