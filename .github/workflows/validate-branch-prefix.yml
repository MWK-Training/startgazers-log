name: validate-branch-prefix-workflow

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-branch-prefix:
    runs-on: ubuntu-latest
    steps:
      - name: Branch Prefix
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH_NAME" != feature/* &&
                "$BRANCH_NAME" != fix/* &&
                "$BRANCH_NAME" != hotfix/* ]]; then
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Use feature/*, fix/* or hotfix/*"
            exit 1
          fi

          echo "Valid branch name: $BRANCH_NAME"
