<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">GitHub activity</p>
        <h1>Stargazers log</h1>
        <p class="intro">A small, searchable record of the repositories I have starred.</p>
      </header>

      <section class="log" aria-labelledby="log-title">
        <div class="section-heading">
          <h2 id="log-title">Recently starred from staging environment</h2>
          <span id="repository-count" class="count" aria-live="polite"></span>
        </div>
        <p id="status" class="status" role="status">Loading repositories...</p>
        <ul id="repository-list" class="repository-list"></ul>
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
